wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Ball v2 Hotspot"
    password: "RZ7D3EzJdPM6"
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

substitutions:
  name: xiaozhi
  friendly_name: "Xiaozhi Ball V2"

  ## Modular version Main SENDSPIN edition — Ball V2 "Interactive" variant
  ##
  ## Same hardware and same core as Ball_v2-sendspin.yaml, but with the HW pack
  ## tuned (see HW/ball_v2_interactive-sendspin_hw.yaml):
  ##   - sendspin media source: explicit buffer_size / codecs / decode_memory
  ##   - left_button: no duplicated pin config, only the strapping-warning override
  ##   - tap on screen always exposed to HA (dead tap/pause stubs removed)
  ##   - touch long-press no longer depends on the "Handle swipes on device" switch
  ##   - clock: new round-safe "Simple" style (DSEG7, yellow/green on black) is
  ##     the default; the other clock styles stay selectable from HA

  ## SETTINGS ######################################################################################################################################

  imagewidth: "240"
  imageheight: "240"

  screenwidth: "240"
  screenheight: "240"
  rotate_display: "0"

  startup_sound: "Home_Connected" # (options are: available, Home_Connected, Home_Connected_Male, Computer_Ready)
  wakeup_sound: "popup" # (options are: popup, wake_word_triggered)
  clock_background_image: "clock" # (options are: clock, hacker, mission, starrysky, waves, tron, chip, waterdrops)
  imagemodel: "Shaun" # options are:

  # AlbertQuackmore, Alita, Alfred, Astrobot, Buzz, Casita, Cybergirl, Dory, EVE, Eyes, Eyes2, GLaDOS, Girl1, Guy1, Guy2, Gwen, HA-character, ha-girl, Hacker, Harley,
  # Jarvis, Luffy, Mario, Max, Prime, Robochibi, Robocop, Robot, Robotgirl, Salem, Sarah, Shaun

  ## SIMPLE CLOCK PALETTE ######## "Simple" clock style (default) — DSEG7 on black ###########################################################
  # 6-digit hex, no leading '#'. Swap the two values to invert the palette.

  simple_clock_time_color: "ffc107" # big DSEG7 time digits (yellow)
  simple_clock_accent_color: "26ed3a" # date line (green)
  simple_clock_status_color: "2e9bff" # top status row: wifi bars, battery (blue)

  # Preset actions page (vertical swipe): the automation the News button targets.
  preset_news_automation: "automation.news"

  # Local timezone for the clock (baked into the firmware at compile time).
  timezone: "America/Toronto"

  # USE ONLINE OR LOCAL MODEL AND WALLPAPER IMAGES, IMAGES SHOULD BE PLACED IN: homeassistant/www/images/
  imagepath: "https://github.com/jeromecornet/xiaozhi-esphome/raw/main/images"
  #  imagepath: "http://homeassistant.local:8123/local/images/"

  ## PRESENCE / MOTION SENSORS ########## IF NOT USING THESE LEAVE THEM ALONE, SCRIPT WILL BREAK WITHOUT ###########################################

  sensor1_entity: "binary_sensor.room_1_presence"
  light1_entity: "binary_sensor.room_1_light"
  sensor1_label: "Room 1"

  sensor2_entity: "binary_sensor.room_2_presence"
  light2_entity: "binary_sensor.room_2_light"
  sensor2_label: "Room 2"

  sensor3_entity: "binary_sensor.room_3_presence"
  light3_entity: "binary_sensor.room_3_light"
  sensor3_label: "Room 3"

  sensor4_entity: "binary_sensor.room_4_presence"
  light4_entity: "binary_sensor.room_4_light"
  sensor4_label: "Room 4"

  sensor5_entity: "binary_sensor.room_5_presence"
  light5_entity: "binary_sensor.room_5_light"
  sensor5_label: "Room 5"

  weather_entity: "weather.forecast_home"

  ##################################################################################################################################################

  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: jeromecornet.xiaozhi-esphome
    version: "2026.9.0"

esp32:
  variant: ESP32S3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

improv_serial:

### USE MODULES FROM GITHUB (default) ############################################################################################################

packages:
  core:
    url: https://github.com/jeromecornet/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/core-sendspin_2026.9.0.yaml
  hw:
    url: https://github.com/jeromecornet/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/ball_v2_interactive-sendspin_hw.yaml
  extcomp:
    url: https://github.com/jeromecornet/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/sendspin-external_components_2026.8.0.yaml

